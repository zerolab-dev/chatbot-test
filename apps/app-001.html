<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>Mapa Interactivo CITE/UT | Zero System Lab</title>

  <style>
    :root {
      color-scheme: light;
      --navy: #071426;
      --red: #ed1b2f;
      --footer-mask: 34px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    .zero-bar {
      width: 100%;
      height: 56px;
      margin: 0;
      padding: 8px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--navy);
      color: #ffffff;
    }

    .brand {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      font-style: italic;
      white-space: nowrap;
    }

    .brand span {
      margin-left: 4px;
      color: var(--red);
    }

    .back {
      min-height: 38px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 9px;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .app-stage {
      position: relative;
      width: 100%;
      height: calc(100% - 56px);
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .app-frame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: #ffffff;
    }

    .footer-mask {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 16px;
      bottom: 0;
      height: var(--footer-mask);
      margin: 0;
      padding: 0;
      background: #ffffff;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      :root {
        --footer-mask: 30px;
      }

      .zero-bar {
        height: 52px;
        padding: 7px 12px;
      }

      .brand {
        font-size: 14px;
      }

      .back {
        min-height: 36px;
        padding: 0 10px;
        font-size: 12px;
      }

      .app-stage {
        height: calc(100% - 52px);
      }
    }
  </style>
</head>

<body>
  <header class="zero-bar">
    <div class="brand">ZERO SYSTEM LAB<span>/</span></div>
    <a class="back" href="../index.html">← Volver a Zero</a>
  </header>

  <main class="app-stage">
    <iframe
      class="app-frame"
      src="https://nf-001.streamlit.app/?embed=true&theme=light"
      title="Mapa Interactivo CITE/UT"
      loading="eager"
      scrolling="yes"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <div class="footer-mask" aria-hidden="true"></div>
  </main>
</body>
</html>
