<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Mapa Interactivo CITE/UT | Zero System Lab</title>

    <style>
        :root {
            --navy: #071426;
            --red: #ed1b2f;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        .zero-bar {
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 22px;
            background: var(--navy);
            color: #ffffff;
        }

        .brand {
            font-size: 16px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: .25px;
            white-space: nowrap;
        }

        .brand span {
            color: var(--red);
            margin-left: 4px;
        }

        .back {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            border: 1px solid rgba(255,255,255,.20);
            border-radius: 9px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .app-stage {
            position: relative;
            width: 100%;
            height: calc(100vh - 56px);
            min-height: 700px;
            overflow: hidden;
            background: #ffffff;
        }

        /*
         * El iframe ocupa prácticamente toda la página.
         * No hay tarjeta, borde, título externo ni contenedor visual.
         *
         * Se añade altura al documento embebido para que su zona inferior
         * quede por debajo de la ventana visible de Zero.
         */
        .app-frame {
            display: block;
            width: 100%;
            height: calc(100% + 360px);
            border: 0;
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        @media (max-width: 700px) {
            .zero-bar {
                min-height: 52px;
                padding: 7px 12px;
            }

            .brand {
                font-size: 14px;
            }

            .back {
                min-height: 36px;
                padding: 0 10px;
                font-size: 12px;
            }

            .app-stage {
                height: calc(100vh - 52px);
                min-height: 650px;
            }

            .app-frame {
                height: calc(100% + 460px);
            }
        }
    </style>
</head>

<body>

    <header class="zero-bar">
        <div class="brand">ZERO SYSTEM LAB<span>/</span></div>
        <a class="back" href="../index.html">← Volver a Zero</a>
    </header>

    <main class="app-stage">
        <iframe
            class="app-frame"
            src="https://nf-001.streamlit.app/?embed=true"
            title="Mapa Interactivo CITE/UT"
            loading="eager"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
    </main>

</body>
</html>
