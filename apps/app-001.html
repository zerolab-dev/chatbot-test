<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Mapa Interactivo CITE/UT | Zero System Lab</title>

    <style>
        :root {
            --navy: #071426;
            --red: #ed1b2f;
            --text: #101828;
            --muted: #667085;
            --border: #e4e7ec;
            --surface: #ffffff;

            /* Ajuste central del recorte.
               Aumentar este valor desplaza más hacia abajo el final real del iframe. */
            --streamlit-extra-height: 420px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background: var(--surface);
            color: var(--text);
        }

        .topbar {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 32px;
            background: var(--navy);
            color: #ffffff;
        }

        .brand {
            font-size: 18px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: .25px;
            white-space: nowrap;
        }

        .brand span {
            color: var(--red);
            margin-left: 4px;
        }

        .back {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 10px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background .2s ease, border-color .2s ease;
        }

        .back:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.38);
        }

        .page {
            width: min(1500px, calc(100% - 32px));
            margin: 0 auto;
            padding: 22px 0 28px;
        }

        .heading {
            margin-bottom: 16px;
        }

        .heading h1 {
            margin: 0;
            font-size: clamp(22px, 3vw, 30px);
            line-height: 1.2;
            letter-spacing: -.5px;
        }

        .heading p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        /*
         * Esta ventana controla qué parte del documento Streamlit es visible.
         * El iframe es más alto que la ventana; el excedente inferior queda recortado.
         */
        .streamlit-window {
            position: relative;
            width: 100%;
            height: calc(100vh - 150px);
            min-height: 650px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #ffffff;
        }

        .streamlit-frame {
            display: block;
            width: 100%;
            height: calc(100% + var(--streamlit-extra-height));
            border: 0;
            background: #ffffff;
        }

        .fallback {
            margin-top: 12px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        .fallback a {
            color: var(--text);
            font-weight: 600;
        }

        @media (max-width: 700px) {
            :root {
                --streamlit-extra-height: 520px;
            }

            .topbar {
                min-height: 62px;
                padding: 10px 14px;
            }

            .brand {
                font-size: 15px;
            }

            .back {
                padding: 0 11px;
                font-size: 13px;
            }

            .page {
                width: calc(100% - 16px);
                padding-top: 14px;
            }

            .heading {
                margin-bottom: 10px;
            }

            .heading p {
                display: none;
            }

            .streamlit-window {
                height: calc(100vh - 122px);
                min-height: 600px;
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="brand">ZERO SYSTEM LAB<span>/</span></div>
        <a class="back" href="../index.html">← Volver a Zero</a>
    </header>

    <main class="page">

        <div class="heading">
            <h1>Mapa Interactivo CITE/UT</h1>
            <p>Explora los CITE y UT por región, servicios y principales temáticas.</p>
        </div>

        <div class="streamlit-window">
            <iframe
                class="streamlit-frame"
                src="https://nf-001.streamlit.app/?embed=true"
                title="Mapa Interactivo CITE/UT"
                loading="eager"
                allow="fullscreen"
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        </div>

        <div class="fallback">
            Si la aplicación no carga correctamente,
            <a href="https://nf-001.streamlit.app/" target="_blank" rel="noopener noreferrer">
                abrirla en una nueva pestaña
            </a>.
        </div>

    </main>

</body>
</html>
