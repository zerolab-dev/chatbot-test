<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero System Lab</title>
    <link rel="stylesheet" href="css/zero.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">ZERO SYSTEM LAB<span>/</span></div>
    </header>

    <main class="zero-app">
        <section class="welcome" id="welcome">
            <h1>Hola, soy <span>Zero.</span></h1>
            <p>¿En qué puedo ayudarte hoy?</p>
        </section>

        <section class="conversation" id="conversation" aria-live="polite"></section>

        <div class="composer-wrapper">
            <form class="composer" id="chatForm">
                <textarea id="messageInput" rows="1" maxlength="500"
                    placeholder="Escribe tu consulta..."
                    aria-label="Escribe tu consulta"></textarea>

                <button class="send-button" id="sendButton" type="submit"
                    aria-label="Enviar mensaje">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3.4 20.4 21 12 3.4 3.6l2.1 6.5L15 12l-9.5 1.9-2.1 6.5Z"></path>
                    </svg>
                </button>
            </form>
            <div class="zero-note">Zero System Lab · Versión inicial</div>
        </div>
    </main>

    <script src="js/engine.js"></script>
    <script src="js/zero.js"></script>
</body>
</html>
